<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; height: 100vh; justify-content: center; align-items: center; }
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: #111b21; padding: 25px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box h2 { margin-bottom: 15px; color: #00a884; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #222d34; background: #202c33; color: #fff; border-radius: 6px; outline: none; }
        .login-box button { width: 100%; padding: 10px; margin-top: 10px; background: #00a884; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #app-container { display: flex; width: 100%; height: 100vh; background: #0b141a; }
        #sidebar { width: 300px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #202c33; font-weight: bold; color: #00a884; border-bottom: 1px solid #222d34; }
        #contact-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; display: flex; flex-direction: column; }
        .contact-item:hover, .contact-item.active { background: #2a3942; }
        .contact-name { font-weight: bold; color: #e9edef; }
        .contact-status { font-size: 0.8em; color: #8696a0; margin-top: 3px; }
        .contact-status.online { color: #00a884; }
        
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
        .chat-header { padding: 15px; background: #202c33; border-bottom: 1px solid #222d34; display: flex; align-items: center; justify-content: space-between; }
        .chat-header .user-info { display: flex; flex-direction: column; }
        .chat-header .status { font-size: 0.8em; color: #8696a0; }
        
        #message-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 0.95em; position: relative; word-wrap: break-word; }
        .message.sent { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 0; }
        .message.received { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 0; }
        .message .meta { font-size: 0.7em; opacity: 0.7; margin-top: 4px; text-align: right; color: #8696a0; }
        
        .chat-input-container { padding: 12px; background: #202c33; display: flex; gap: 10px; border-top: 1px solid #222d34; }
        .chat-input-container input { flex: 1; padding: 10px 15px; background: #2a3942; border: none; color: #fff; border-radius: 8px; outline: none; }
        .chat-input-container button { padding: 10px 20px; background: #00a884; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="login-box">
            <h2>Private Chat</h2>
            <input type="text" id="username-input" placeholder="Your Name">
            <input type="password" id="password-input" placeholder="Password (272009)">
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <div class="sidebar-header" id="my-profile">Contacts</div>
            <div id="contact-list"></div>
        </div>
        <div id="chat-area">
            <div class="chat-header">
                <div class="user-info">
                    <span id="chat-title" style="font-weight: bold;">Select a Contact</span>
                    <span id="chat-subtitle" class="status"></span>
                </div>
            </div>
            <div id="message-container"></div>
            <div class="chat-input-container">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = '';
        let currentChatUser = '';
        let contactsData = { contacts: [], online: [], lastSeen: {} };

        function getDeviceTime() {
            const d = new Date();
            let hours = d.getHours();
            let minutes = d.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 ko 12 banana
            minutes = minutes < 10 ? '0' + minutes : minutes;
            const strHours = hours < 10 ? '0' + hours : hours;
            return strHours + ':' + minutes + ' ' + ampm;
        }

        function login() {
            const name = document.getElementById('username-input').value.trim();
            const pass = document.getElementById('password-input').value.trim();

            if (!name) {
                alert('Please enter your name');
                return;
            }
            if (pass !== '272009') {
                alert('Wrong Password!');
                return;
            }

            currentUser = name;
            document.getElementById('my-profile').innerText = 'Logged in as: ' + currentUser;
            document.getElementById('login-modal').style.display = 'none';

            const currentTime = getDeviceTime();
            socket.emit('register_user', { username: currentUser, time: currentTime });

            // User disconnect/close hone se pehle last seen update karein
            window.addEventListener('beforeunload', () => {
                socket.emit('update_last_seen', { time: getDeviceTime() });
            });
        }

        socket.on('contacts_update', (data) => {
            contactsData = data;
            renderContacts();
            if (currentChatUser) {
                updateChatHeaderStatus();
            }
        });

        function renderContacts() {
            const listContainer = document.getElementById('contact-list');
            listContainer.innerHTML = '';

            const allKnown = new Set([
                ...contactsData.contacts,
                ...Object.keys(contactsData.lastSeen)
            ]);

            allKnown.forEach(user => {
                if (user.toLowerCase() === currentUser.toLowerCase()) return;

                const isOnline = contactsData.online.map(u => u.toLowerCase()).includes(user.toLowerCase());
                const lastSeenTime = contactsData.lastSeen[user.toLowerCase()];

                const div = document.createElement('div');
                div.className = 'contact-item' + (currentChatUser.toLowerCase() === user.toLowerCase() ? ' active' : '');
                
                let statusText = 'Offline';
                let statusClass = '';
                if (isOnline) {
                    statusText = '● Online';
                    statusClass = 'online';
                } else if (lastSeenTime) {
                    statusText = 'Last seen: ' + lastSeenTime;
                }

                div.innerHTML = `
                    <div class="contact-name">${user}</div>
                    <div class="contact-status ${statusClass}">${statusText}</div>
                `;

                div.onclick = () => selectContact(user);
                listContainer.appendChild(div);
            });
        }

        function selectContact(user) {
            currentChatUser = user;
            document.getElementById('chat-title').innerText = user;
            updateChatHeaderStatus();
            renderContacts();

            document.getElementById('message-container').innerHTML = '';
            socket.emit('load_private_chat', { user1: currentUser, user2: currentChatUser });
        }

        function updateChatHeaderStatus() {
            if (!currentChatUser) return;
            const subtitle = document.getElementById('chat-subtitle');
            const isOnline = contactsData.online.map(u => u.toLowerCase()).includes(currentChatUser.toLowerCase());
            const lastSeenTime = contactsData.lastSeen[currentChatUser.toLowerCase()];

            if (isOnline) {
                subtitle.innerText = 'Online';
                subtitle.style.color = '#00a884';
            } else if (lastSeenTime) {
                subtitle.innerText = 'Last seen at ' + lastSeenTime;
                subtitle.style.color = '#8696a0';
            } else {
                subtitle.innerText = 'Offline';
                subtitle.style.color = '#8696a0';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatUser) return;

            const msgTime = getDeviceTime();

            socket.emit('private_message', {
                sender: currentUser,
                receiver: currentChatUser,
                text: text,
                type: 'text',
                time: msgTime
            });

            // Message bhejte time last seen update kar lo
            socket.emit('update_last_seen', { time: msgTime });

            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('chat_message', (msg) => {
            if (
                (msg.sender.toLowerCase() === currentUser.toLowerCase() && msg.receiver.toLowerCase() === currentChatUser.toLowerCase()) ||
                (msg.sender.toLowerCase() === currentChatUser.toLowerCase() && msg.receiver.toLowerCase() === currentUser.toLowerCase())
            ) {
                appendMessage(msg);
            }
        });

        socket.on('load_history', (messages) => {
            const container = document.getElementById('message-container');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        });

        function appendMessage(msg) {
            const container = document.getElementById('message-container');
            const div = document.createElement('div');
            const isSent = msg.sender.toLowerCase() === currentUser.toLowerCase();
            
            div.className = 'message ' + (isSent ? 'sent' : 'received');
            div.innerHTML = `
                <div>${msg.text}</div>
                <div class="meta">${msg.time}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
