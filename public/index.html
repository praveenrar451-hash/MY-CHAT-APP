<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #111b21; color: #e9edef; }
        
        #auth-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #111b21; position: fixed; top:0; left:0; width:100%; z-index:9999; }
        .auth-box { background: #202c33; padding: 30px; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; background: #2a3942; color: #fff; outline:none; }
        
        #main-app { display: none; width: 100%; max-width: 500px; height: 100%; margin: 0 auto; background: #111b21; flex-direction: column; position: relative; }
        
        .app-header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; height: 60px; }
        #contacts-view { flex: 1; overflow-y: auto; }
        .contact-item { padding: 15px; border-bottom: 1px solid #222d34; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .contact-item:hover { background: #202c33; }
        
        #chat-view { display: none; flex: 1; flex-direction: column; background: #0b141a; height: 100%; overflow: hidden; position: absolute; top:0; left:0; width:100%; }
        
        .chat-header { background: #202c33; padding: 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; height: 60px; z-index: 10; }
        .chat-header-left { display: flex; align-items: center; gap: 10px; }
        .call-icons { display: flex; gap: 10px; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background-color: #0b141a; -webkit-overflow-scrolling: touch; }
        
        .msg { padding: 8px 12px; border-radius: 8px; background: #202c33; max-width: 75%; word-break: break-word; position: relative; margin-bottom: 6px; flex-shrink: 0; }
        .my-msg { background: #005c4b; align-self: flex-end; }
        
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 4px; display: block; }
        .msg audio { max-width: 100%; margin-top: 4px; height: 35px; }

        .msg-meta { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; display: flex; align-items: center; gap: 3px; }
        .tick { font-size: 11px; color: #8696a0; }
        .tick.read { color: #53bdeb; }

        .input-area { background: #202c33; padding: 10px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; height: 65px; z-index: 10; }
        .input-area input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; }
        
        .media-btn { background: #2a3942; color: #00a884; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .media-btn.recording { background: #ff4b4b; color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .send-btn { background: #00a884; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 20, 26, 0.95); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .video-container { position: relative; width: 90%; max-width: 400px; height: 350px; background: #000; border-radius: 10px; overflow: hidden; display: none; margin-bottom: 15px; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 100px; height: 130px; object-fit: cover; position: absolute; bottom: 10px; right: 10px; border-radius: 8px; border: 2px solid #00a884; background: #222; z-index: 10; }
        
        .call-avatar { width: 90px; height: 90px; background: #2a3942; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #00a884; margin-bottom: 15px; }
        .call-actions { display: flex; gap: 30px; margin-top: 25px; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .accept-btn { background: #00a884; }
        .reject-btn { background: #ff4b4b; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="color:#00a884; margin-bottom:15px;">Private Chat</h2>
        <input type="password" id="pass-input" placeholder="Password">
        <input type="text" id="name-input" placeholder="Your Name">
        <button onclick="login()" style="width:100%; padding:10px; background:#00a884; color:#fff; border:none; border-radius:5px; cursor:pointer;">Login</button>
    </div>
</div>

<div id="main-app">
    <div class="app-header">
        <span id="app-user-title" style="font-weight:bold; color:#00a884;">Chat</span>
        <button onclick="localStorage.clear(); location.reload();" style="background:#ff4b4b; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Logout</button>
    </div>
    
    <div id="contacts-view">
        <div style="padding:15px; color:#8696a0; font-size:13px;">Contacts</div>
        <div id="contacts-list"></div>
    </div>

    <div id="chat-view">
        <div class="chat-header">
            <div class="chat-header-left">
                <button onclick="showContacts()" style="background:none; border:none; color:#00a884; font-size:18px; cursor:pointer;">←</button>
                <div>
                    <strong id="active-chat-user" style="color:#fff; display:block;">User</strong>
                    <span id="chat-substatus" style="font-size:11px; color:#8696a0;"></span>
                    <span id="typing-status" style="font-size:11px; color:#00a884; display:none;">typing...</span>
                </div>
            </div>
            <div class="call-icons">
                <button onclick="startCall(false)" class="media-btn" title="Voice Call">📞</button>
                <button onclick="startCall(true)" class="media-btn" title="Video Call">📹</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <div class="input-area">
            <input type="file" id="image-file-input" accept="image/*" style="display:none;" onchange="sendImage(this)">
            <button class="media-btn" onclick="document.getElementById('image-file-input').click()" title="Send Photo">📷</button>
            <button id="mic-btn" class="media-btn" onclick="toggleVoiceRecording()" title="Voice Note">🎙️</button>
            
            <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<div id="call-modal">
    <div id="call-avatar" class="call-avatar">📞</div>
    <div id="video-container" class="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
    </div>
    <h3 id="call-status-text" style="color: #fff; margin-bottom: 10px;">Ringing...</h3>
    <p id="call-user-name" style="color: #8696a0; font-size: 16px;"></p>
    <audio id="remote-audio" autoplay></audio>
    <div class="call-actions" id="call-action-buttons"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myName = localStorage.getItem('chat_username') || '';
    let currentChat = '';
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let typingTimer;

    let globalOnline = [];
    let globalLastSeen = {};

    let peerConnection;
    let localStream;
    let incomingSignalData = null;
    let pendingCandidates = [];
    let isVideoCall = false;

    const servers = { 
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' }
        ] 
    };

    window.onload = () => {
        if (localStorage.getItem('chat_password') === '272009' && myName) {
            startApp();
        }
    };

    function login() {
        const p = document.getElementById('pass-input').value;
        const n = document.getElementById('name-input').value.trim();
        if (p === '272009' && n) {
            localStorage.setItem('chat_password', p);
            localStorage.setItem('chat_username', n);
            myName = n;
            startApp();
        } else {
            alert('Wrong Password or Name!');
        }
    }

    function startApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        document.getElementById('app-user-title').innerText = myName;
        socket.emit('register_user', myName);
        showContacts();
    }

    function showContacts() {
        document.getElementById('contacts-view').style.display = 'block';
        document.getElementById('chat-view').style.display = 'none';
        currentChat = '';
        socket.emit('register_user', myName);
    }

    function openChat(user) {
        currentChat = user;
        document.getElementById('contacts-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('active-chat-user').innerText = user;
        document.getElementById('typing-status').style.display = 'none';
        document.getElementById('messages').innerHTML = '';
        
        updateHeaderStatus();
        socket.emit('load_private_chat', { user1: myName, user2: currentChat });
    }

    function updateHeaderStatus() {
        const subStatus = document.getElementById('chat-substatus');
        if (!currentChat) return;
        
        const isOnline = globalOnline.some(u => u.toLowerCase() === currentChat.toLowerCase());
        if (isOnline) {
            subStatus.innerText = 'online';
            subStatus.style.color = '#00a884';
        } else {
            const time = globalLastSeen[currentChat.toLowerCase()];
            subStatus.innerText = time ? `last seen at ${time}` : 'offline';
            subStatus.style.color = '#8696a0';
        }
    }

    socket.on('contacts_update', ({ contacts, online, lastSeen }) => {
        globalOnline = online || [];
        globalLastSeen = lastSeen || {};

        const list = document.getElementById('contacts-list');
        list.innerHTML = '';
        contacts.forEach(user => {
            if (user.toLowerCase() !== myName.toLowerCase()) {
                const isOnline = globalOnline.some(u => u.toLowerCase() === user.toLowerCase());
                const lsTime = globalLastSeen[user.toLowerCase()];
                
                let statusTxt = isOnline ? 'Online' : (lsTime ? `Last seen at ${lsTime}` : 'Offline');
                
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => openChat(user);
                div.innerHTML = `<span>${user}</span> <span style="font-size:12px; color:${isOnline ? '#00a884' : '#8696a0'}">${statusTxt}</span>`;
                list.appendChild(div);
            }
        });

        if (currentChat) {
            updateHeaderStatus();
        }
    });

    function handleTyping() {
        if (!currentChat) return;
        socket.emit('typing', { receiver: currentChat, isTyping: true, sender: myName });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            socket.emit('typing', { receiver: currentChat, isTyping: false, sender: myName });
        }, 1500);
    }

    socket.on('display_typing', ({ sender, isTyping }) => {
        if (currentChat && currentChat.toLowerCase() === sender.toLowerCase()) {
            document.getElementById('typing-status').style.display = isTyping ? 'block' : 'none';
            document.getElementById('chat-substatus').style.display = isTyping ? 'none' : 'block';
        }
    });

    function sendMsg() {
        const input = document.getElementById('msg-input');
        if (input.value.trim() && currentChat) {
            socket.emit('private_message', { sender: myName, receiver: currentChat, text: input.value, type: 'text' });
            input.value = '';
            socket.emit('typing', { receiver: currentChat, isTyping: false, sender: myName });
        }
    }

    function sendImage(input) {
        if (input.files && input.files[0] && currentChat) {
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('private_message', { sender: myName, receiver: currentChat, text: e.target.result, type: 'image' });
            };
            reader.readAsDataURL(input.files[0]);
            input.value = '';
        }
    }

    function toggleVoiceRecording() {
        const micBtn = document.getElementById('mic-btn');
        if (!isRecording) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        if (currentChat) {
                            socket.emit('private_message', { sender: myName, receiver: currentChat, text: e.target.result, type: 'audio' });
                        }
                    };
                    reader.readAsDataURL(audioBlob);
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerText = '⏹️';
            }).catch(err => alert('Microphone access denied!'));
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎙️';
        }
    }

    socket.on('load_history', history => {
        const box = document.getElementById('messages');
        box.innerHTML = '';
        history.forEach(m => appendMsg(m));
        box.scrollTop = box.scrollHeight;
    });

    socket.on('chat_message', data => {
        if (currentChat && (data.sender.toLowerCase() === currentChat.toLowerCase() || data.receiver.toLowerCase() === currentChat.toLowerCase())) {
            appendMsg(data);
            const box = document.getElementById('messages');
            box.scrollTop = box.scrollHeight;
            
            if (data.sender.toLowerCase() === currentChat.toLowerCase()) {
                socket.emit('mark_read', { sender: currentChat, receiver: myName });
            }
        }
    });

    socket.on('messages_read_update', ({ by }) => {
        if (currentChat && currentChat.toLowerCase() === by.toLowerCase()) {
            document.querySelectorAll('.my-msg .tick').forEach(tick => {
                tick.innerText = '✓✓';
                tick.classList.add('read');
            });
        }
    });

    function appendMsg(data) {
        const box = document.getElementById('messages');
        const isMe = data.sender.toLowerCase() === myName.toLowerCase();
        
        let existingMsg = document.getElementById('msg-' + data.id);
        if (existingMsg) {
            existingMsg.remove();
        }

        const div = document.createElement('div');
        div.id = 'msg-' + (data.id || Math.random());
        div.className = 'msg ' + (isMe ? 'my-msg' : '');
        
        let content = data.type === 'image' ? `<img src="${data.text}">` : (data.type === 'audio' ? `<audio controls src="${data.text}"></audio>` : data.text);
        
        let timeStr = data.time || '';
        let metaHtml = `<span class="msg-meta"><span>${timeStr}</span>`;

        if (isMe) {
            let tickSymbol = '✓';
            let tickClass = 'tick';
            if (data.status === 'delivered') {
                tickSymbol = '✓✓';
            } else if (data.status === 'read') {
                tickSymbol = '✓✓';
                tickClass = 'tick read';
            }
            metaHtml += `<span class="${tickClass}">${tickSymbol}</span>`;
        }
        metaHtml += `</span>`;

        div.innerHTML = content + metaHtml;
        box.appendChild(div);
    }

    async function startCall(video = false) {
        if (!currentChat) return;
        isVideoCall = video;
        pendingCandidates = [];
        
        setupCallUI(video);
        document.getElementById('call-modal').style.display = 'flex';
        document.getElementById('call-status-text').innerText = video ? 'Video Calling...' : 'Voice Calling...';
        document.getElementById('call-user-name').innerText = currentChat;
        document.getElementById('call-action-buttons').innerHTML = `<button class="call-btn reject-btn" onclick="endCall()">❌</button>`;

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
            if (isVideoCall) {
                document.getElementById('local-video').srcObject = localStream;
            }
            
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            socket.emit('call_user', { userToCall: currentChat, signalData: offer, from: myName, isVideo: isVideoCall });
        } catch (err) {
            alert('Media Permission Denied!');
            endCall();
        }
    }

    socket.on('incoming_call', ({ from, signal, isVideo }) => {
        currentChat = from;
        isVideoCall = isVideo;
        incomingSignalData = typeof signal === 'string' ? JSON.parse(signal) : signal;
        pendingCandidates = [];

        setupCallUI(isVideo);
        document.getElementById('call-modal').style.display = 'flex';
        document.getElementById('call-status-text').innerText = isVideo ? 'Incoming Video Call...' : 'Incoming Audio Call...';
        document.getElementById('call-user-name').innerText = from;
        document.getElementById('call-action-buttons').innerHTML = `
            <button class="call-btn accept-btn" onclick="acceptCall()">📞</button>
            <button class="call-btn reject-btn" onclick="endCall()">❌</button>
        `;
    });

    async function acceptCall() {
        document.getElementById('call-status-text').innerText = 'Connecting...';
        document.getElementById('call-action-buttons').innerHTML = `<button class="call-btn reject-btn" onclick="endCall()">❌</button>`;
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
            if (isVideoCall) {
                document.getElementById('local-video').srcObject = localStream;
            }

            createPeerConnection();

            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingSignalData));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('answer_call', { signal: answer, to: currentChat });

            while (pendingCandidates.length > 0) {
                const candidate = pendingCandidates.shift();
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
            }
            document.getElementById('call-status-text').innerText = 'Connected';
        } catch (err) {
            alert('Media Permission Denied!');
            endCall();
        }
    }

    socket.on('call_accepted', async signal => {
        document.getElementById('call-status-text').innerText = 'Connected';
        if (peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
            while (pendingCandidates.length > 0) {
                const candidate = pendingCandidates.shift();
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
            }
        }
    });

    function setupCallUI(video) {
        if (video) {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('call-avatar').style.display = 'none';
        } else {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('call-avatar').style.display = 'flex';
        }
    }

    function createPeerConnection() {
        if (peerConnection) peerConnection.close();
        peerConnection = new RTCPeerConnection(servers);
        
        if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }

        peerConnection.ontrack = event => {
            if (isVideoCall) {
                document.getElementById('remote-video').srcObject = event.streams[0];
            } else {
                document.getElementById('remote-audio').srcObject = event.streams[0];
            }
        };

        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                socket.emit('ice_candidate', { candidate: event.candidate, to: currentChat });
            }
        };
    }

    socket.on('ice_candidate', candidate => {
        if (peerConnection && peerConnection.remoteDescription) {
            peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
        } else {
            pendingCandidates.push(candidate);
        }
    });

    function endCall() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (peerConnection) { 
            peerConnection.close(); 
            peerConnection = null; 
        }
        if (currentChat) {
            socket.emit('end_call', { to: currentChat });
        }
        document.getElementById('call-modal').style.display = 'none';
        document.getElementById('remote-audio').srcObject = null;
        document.getElementById('remote-video').srcObject = null;
        document.getElementById('local-video').srcObject = null;
    }

    socket.on('call_ended', () => endCall());
</script>
</body>
</html>
